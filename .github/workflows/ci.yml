name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - v1.5-code-maintenance
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: Test (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install base dependencies
        run: python -m pip install -r requirements.txt

      - name: Run workbench validation (compile + pytest + pip check)
        run: python -m tools.workbench validate --profile full
